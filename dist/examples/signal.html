<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Signal / standalone example</title>
    <style>
      body {
        margin: 0;
        background: #17252d;
        color: #edf2de;
        font: 16px system-ui;
      }
      canvas {
        display: block;
      }
      aside {
        position: absolute;
        top: 24px;
        left: 24px;
        max-width: 330px;
        padding: 20px;
        background: #101a22de;
        border: 1px solid #506064;
        border-radius: 8px;
      }
      h1 {
        font-size: 24px;
        margin: 0 0 8px;
      }
      p {
        font-size: 14px;
        line-height: 1.6;
      }
      a {
        color: #ffc499;
      }
      button {
        padding: 8px 12px;
        background: #ffc499;
        color: #302622;
        border: 0;
        border-radius: 4px;
        cursor: pointer;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three/build/three.module.js",
          "three/addons/": "/vendor/three/addons/",
          "@cranberry-forge/signal": "/packages/signal/index.js"
        }
      }
    </script>
  </head>
  <body>
    <aside>
      <h1>Signal, on its own.</h1>
      <p>
        One cone, a sampled heightfield and a moving target. Charge the attack
        to query the target's footprint when the warning completes.
      </p>
      <button id="arm">Charge attack</button>
      <p id="status" role="status" aria-live="polite">
        Ready. Drag to orbit the arena.
      </p>
      <p>
        <a href="/examples/signal.js">Read the complete source</a> ·
        <a href="/signal.html">Workbench</a>
      </p>
    </aside>
    <script type="module" src="./signal.js"></script>
  </body>
</html>
